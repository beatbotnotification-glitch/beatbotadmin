<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <!-- Master Pink to Blue Gradient -->
    <linearGradient id="beatbotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2D8D" />
      <stop offset="50%" stop-color="#9D4EDD" />
      <stop offset="100%" stop-color="#1E88FF" />
    </linearGradient>

    <!-- Left Earcup Pink Gradient -->
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF2D8D" />
      <stop offset="100%" stop-color="#D80068" />
    </linearGradient>

    <!-- Right Earcup Blue Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E88FF" />
      <stop offset="100%" stop-color="#0052D4" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(0, 20)">
    <!-- Headphone Arc Ring -->
    <path d="M 195 240 A 135 135 0 0 1 405 240" fill="none" stroke="url(#beatbotGrad)" stroke-width="18" stroke-linecap="round" />

    <!-- Left Earcup -->
    <path d="M 180 205 C 160 205 160 275 180 275 C 195 275 195 205 180 205 Z" fill="url(#pinkGrad)" />
    <rect x="188" y="215" width="14" height="50" rx="7" fill="url(#pinkGrad)" />

    <!-- Right Earcup -->
    <path d="M 420 205 C 440 205 440 275 420 275 C 405 275 405 205 420 205 Z" fill="url(#blueGrad)" />
    <rect x="398" y="215" width="14" height="50" rx="7" fill="url(#blueGrad)" />

    <!-- Main 'b' Shape -->
    <!-- 'b' Stem & Outer Ring -->
    <path d="M 240 135 
             C 255 135 265 145 265 160 
             L 265 205 
             A 72 72 0 1 1 240 280 
             L 240 160 
             C 240 145 245 135 240 135 Z" 
          fill="url(#beatbotGrad)" />

    <!-- 'b' Loop Fill with Inner Cutout -->
    <path d="M 300 240 A 70 70 0 1 1 300 239.9 Z" fill="url(#beatbotGrad)" />
    <circle cx="300" cy="240" r="44" fill="#0D0F17" />

    <!-- Equalizer Waves inside 'b' circle -->
    <rect x="276" y="230" width="7" height="20" rx="3.5" fill="url(#beatbotGrad)" />
    <rect x="288" y="218" width="7" height="44" rx="3.5" fill="url(#beatbotGrad)" />
    <rect x="300" y="210" width="7" height="60" rx="3.5" fill="url(#beatbotGrad)" />
    <rect x="312" y="222" width="7" height="36" rx="3.5" fill="url(#beatbotGrad)" />
    <rect x="324" y="232" width="7" height="16" rx="3.5" fill="url(#beatbotGrad)" />

    <!-- Typography: beatbot -->
    <text x="300" y="415" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="82" text-anchor="middle" letter-spacing="-1.5">
      <tspan fill="#FFFFFF">beat</tspan><tspan fill="url(#beatbotGrad)">bot</tspan>
    </text>

    <!-- Tagline: YOUR BEAT. YOUR WORLD. -->
    <text x="300" y="460" font-family="'Outfit', sans-serif" font-weight="700" font-size="20" letter-spacing="6" fill="#FF2D8D" text-anchor="middle">
      YOUR BEAT. YOUR WORLD.
    </text>
  </g>
</svg>